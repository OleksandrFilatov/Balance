spring:
  application:
    name: balance
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/balance_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

balance:
  time-zone: ${BALANCE_TIME_ZONE:Europe/Berlin}
  recurring:
    monthly-auto-enabled: ${BALANCE_MONTHLY_AUTO_ENABLED:false}
    auto-enabled: ${BALANCE_RECURRING_AUTO_ENABLED:false}
    poll-ms: ${BALANCE_RECURRING_POLL_MS:60000}
